services:
  - type: web
    name: agendamedica-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: |
      corepack enable
      corepack prepare pnpm@10.33.0 --activate
      pnpm install --frozen-lockfile
      pnpm prisma generate
      pnpm build
    startCommand: |
      corepack enable
      corepack prepare pnpm@10.33.0 --activate
      pnpm prisma migrate deploy
      pnpm start:prod
    autoDeploy: true
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agendamedica-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 30

databases:
  - name: agendamedica-db
    databaseName: agenda_medica
    user: agendamedica
    plan: free
